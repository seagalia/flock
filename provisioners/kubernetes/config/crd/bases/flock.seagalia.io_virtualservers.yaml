                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  typedOptions:
                    description: |-
                      Extension point for custom options dedicated to a load balancer implementation.
                      valid extensions are:
                      - flock.extensions.vs.starling_options.v1.TcpUdpOptions
                      - flock.extensions.vs.f5_options.v1.VirtualServerOptions
                    properties:
                      f5:
                        description: |-
                          VirtualServerOptions holds the F5 agent options of a virtual server, packed in the `typed_options` field of the
                          tcp, udp, http or tls over tcp route config of `flock.api.config.vs.v1.VirtualServer`.

                          Every string field naming a BIG-IP object takes the full path of an object that already exists on the BIG-IP, for
                          example `/Common/my_irule`. The agent never creates nor changes those objects. A path to a missing object makes the
                          BIG-IP refuse the partition of the virtual server, reported as an error on the virtual server.
                        properties:
                          auto:
                            description: Translate to a self IP of the BIG-IP (automap).
                            type: boolean
                          clientTLSProfile:
                            description: |-
                              Client SSL profile, facing the clients, replacing the one the agent builds from the certificates of the virtual
                              server.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          fallbackPersistenceProfile:
                            description: Persistence profile used when the persistence
                              profile can't find a record.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          httpProfile:
                            description: HTTP profile of an http virtual server, replacing
                              the default one.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          irules:
                            description: iRules attached to the virtual server after
                              the iRules the agent generates.
                            items:
                              maxLength: 255
                              pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                              type: string
                            maxItems: 64
                            type: array
                            x-kubernetes-list-type: atomic
                          none:
                            description: Keep the client address. The endpoints must
                              route their answers back through the BIG-IP.
                            type: boolean
                          persistenceProfile:
                            description: |-
                              Persistence profile of the virtual server. Without it the virtual server has no persistence, unless its backend
                              uses a consistent hash lb_policy.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          pool:
                            description: Translate to the addresses of an existing
                              SNAT pool, given by full path.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          serverTLSProfile:
                            description: Server SSL profile, facing the endpoints,
                              replacing the one the agent builds from the TLS settings
                              of the backend.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          tcpProfile:
                            description: TCP profile, replacing the default one, for
                              tcp, http and tls over tcp virtual servers.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          udpProfile:
                            description: UDP profile, replacing the default one, for
                              udp virtual servers.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          wafPolicy:
                            description: WAF (Advanced WAF) policy of the virtual
                              server.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: at most one of auto, none, pool can be set
                          rule: '[has(self.auto), has(self.none), has(self.pool)].filter(x,
                            x).size() <= 1'
                      starling:
                        description: |-
                          TcpUdpOptions holds the starling agent options of a tcp or udp virtual server, packed in the `typed_options` field of
                          `flock.api.config.vs.v1.TcpRouteConfig` or `flock.api.config.vs.v1.UdpRouteConfig`.

                          The agent serves these virtual servers with IPVS, or with envoy when the backend uses the PROXY protocol, when the
                          virtual server accepts it, when the kernel's IPVS can't apply the load balancing policy of the backend, or in dev
                          mode.
                        properties:
                          disableDnat:
                            description: |-
                              DisableDnat keeps the VIP as the destination of the packets sent to the backends. With IPVS the agent forwards them
                              with direct routing instead of NAT (masquerade), so each backend must accept the VIP as a local address. With envoy
                              it adds envoy's `original_dst` listener filter.
                            type: boolean
                          disableSnat:
                            description: |-
                              DisableSnat keeps the client address as the source of the packets sent to the backends, so the backends see the
                              real client IP and must route their replies back through the agent. With IPVS the agent then sets no nftables SNAT
                              mark for the port of the virtual server. With envoy it adds envoy's `original_src` listener filter, which the agent
                              setting `advertisement.disable_snat` also adds to every envoy listener.
                            type: boolean
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: at most one of f5, starling can be set
                      rule: '[has(self.f5), has(self.starling)].filter(x, x).size()
                        <= 1'
                required:
                - backendRef
                type: object
            required:
            - port
            type: object
            x-kubernetes-validations:
            - message: exactly one of tcpRouteConfig, udpRouteConfig, httpRoutesConfig,
                tlsTCPRoutesConfig must be set
              rule: '[has(self.tcpRouteConfig), has(self.udpRouteConfig), has(self.httpRoutesConfig),
                has(self.tlsTCPRoutesConfig)].exists_one(x, x)'
          status:
            description: status defines the observed state of VirtualServer
            properties:
              conditions:
                description: conditions tell whether flock holds the spec of the object
                  (Ready) and why not when it doesn't.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation of the spec last
                  written to flock.
                format: int64
                minimum: 0
                type: integer
              uuid:
                description: uuid of the flock resource made from this object, empty
                  until it is created.
                maxLength: 36
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
