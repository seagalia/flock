---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: virtualservers.flock.seagalia.io
spec:
  group: flock.seagalia.io
  names:
    kind: VirtualServer
    listKind: VirtualServerList
    plural: virtualservers
    singular: virtualserver
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VirtualServer is the flock virtual server of the same name, its
          spec converted by ToProto.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VirtualServer
            properties:
              enableL3Log:
                description: |-
                  Set to true to log tcp syn packets and udp packets (for udp virtual server)
                  This log will give source ip, source port, destination ip, destination port and the protocol used.
                  It is off by default because it can produce a lot of logs.
                  On udp, each packet produces a log line, which can be a lot of logs and can have a performance impact.
                  On a port shared by several virtual servers of a VIP, enabling it on one of them logs the whole port.
                  It only works on agent implementations that support it.
                type: boolean
              httpRoutesConfig:
                description: HTTP Route configuration
                properties:
                  acceptProxyProtocol:
                    description: |-
                      Read a proxy protocol header (v1 or v2) sent by the client before anything else:
                      the client address it holds becomes the client address of the connection.
                      Connections without the header are refused.
                    type: boolean
                  externalAuths:
                    description: |-
                      External auth policies of the virtual server, which virtual hosts and routes pick by name. The controller refuses
                      a policy name defined twice, and a virtual host or route naming a policy not defined here.
                    items:
                      description: |-
                        ExternalAuth asks an auth service whether a request may pass, before it reaches its backend. The auth service gets
                        a request with no body on the path of the policy and the method of the original request. It allows the request by
                        answering exactly 200. Any other status below 500 denies it, and the client gets that status and body. A 5xx, a
                        timeout, a connection error or an unreadable answer follows failure_mode.
                        Header names are lowercased by the defaults. Every inbound header named in the upstream_headers of any policy of the
                        virtual server is removed from the requests of all its routes, checked or not, so a client can't spoof a header the
                        auth service is trusted to set.
                      properties:
                        backendRef:
                          description: |-
                            UUID of the backend serving the auth service. Its TLS, discovery, health checks and load balancing apply.
                            The controller refuses a backend that doesn't exist.
                          properties:
                            name:
                              description: name of the object.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                          required:
                          - name
                          type: object
                        clientHeaders:
                          description: |-
                            Headers of a deny response sent to the client, on top of location and www-authenticate which are always sent.
                            An empty list sends nothing else.
                          items:
                            maxLength: 256
                            pattern: ^:?[0-9a-zA-Z!#$%&'*+.\-^_|~\x60]+$
                            type: string
                          maxItems: 64
                          type: array
                          x-kubernetes-list-type: atomic
                        failureMode:
                          description: What happens when the auth service can't answer.
                            Default to DENY.
                          enum:
                          - Deny
                          - Allow
                          type: string
                        name:
                          description: Name of the policy, unique in the virtual server,
                            referenced by virtual hosts and routes.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        path:
                          description: Exact path of the check request, the path of
                            the original request is never appended to it.
                          maxLength: 2048
                          type: string
                          x-kubernetes-validations:
                          - message: must start with "/"
                            rule: self.startsWith("/")
                        requestHeaders:
                          description: |-
                            Headers of the client request forwarded to the auth service, with all their values. The authorization header is
                            always forwarded. The original method, host, uri and protocol are sent in the x-forwarded-method, x-forwarded-host,
                            x-forwarded-uri and x-forwarded-proto headers, and x-forwarded-for holds only the client address the agent sees,
                            never the value the client sent. These headers are set on the check request only, never on the backend request.
                            An empty list forwards nothing else: there is no implicit pass-all.
                          items:
                            maxLength: 256
                            pattern: ^:?[0-9a-zA-Z!#$%&'*+.\-^_|~\x60]+$
                            type: string
                          maxItems: 64
                          type: array
                          x-kubernetes-list-type: atomic
                        statusOnError:
                          description: |-
                            Status sent to the client, with an empty body, when the auth service can't answer and failure_mode is DENY.
                            Only the HTTP statuses every dataplane can answer are accepted: 400 to 417, 421 to 424, 426, 428, 429, 431, 500 to
                            508, 510 and 511. Default to 503.
                          enum:
                          - 400
                          - 401
                          - 402
                          - 403
                          - 404
                          - 405
                          - 406
                          - 407
                          - 408
                          - 409
                          - 410
                          - 411
                          - 412
                          - 413
                          - 414
                          - 415
                          - 416
                          - 417
                          - 421
                          - 422
                          - 423
                          - 424
                          - 426
                          - 428
                          - 429
                          - 431
                          - 500
                          - 501
                          - 502
                          - 503
                          - 504
                          - 505
                          - 506
                          - 507
                          - 508
                          - 510
                          - 511
                          format: int32
                          minimum: 0
                          type: integer
                        timeoutMilliseconds:
                          description: Budget of the whole check (connect, send and
                            read of the response), up to 30s. Default to 1s.
                          exclusiveMinimum: true
                          format: int32
                          maximum: 30000
                          minimum: 0
                          type: integer
                        upstreamHeaders:
                          description: |-
                            Headers of an allow response set, replacing any value, on the request sent to the backend. An empty list sets
                            nothing. Host, pseudo headers and hop by hop headers are refused.
                          items:
                            maxLength: 256
                            pattern: ^:?[0-9a-zA-Z!#$%&'*+.\-^_|~\x60]+$
                            type: string
                            x-kubernetes-validations:
                            - message: host, pseudo headers and hop by hop headers
                                can't be set on the upstream request
                              rule: '!(self in [''host'', ''connection'', ''transfer-encoding'',
                                ''te'', ''upgrade'', ''keep-alive'', ''proxy-connection'',
                                ''trailer'', ''content-length'']) && !self.startsWith('':'')'
                          maxItems: 64
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - backendRef
                      - name
                      - path
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  typedOptions:
                    description: |-
                      Extension point for custom options dedicated to a load balancer implementation.
                      valid extensions are:
                      - flock.extensions.vs.starling_options.v1.HttpOptions
                      - flock.extensions.vs.f5_options.v1.VirtualServerOptions
                    properties:
                      f5:
                        description: |-
                          VirtualServerOptions holds the F5 agent options of a virtual server, packed in the `typed_options` field of the
                          tcp, udp, http or tls over tcp route config of `flock.api.config.vs.v1.VirtualServer`.

                          Every string field naming a BIG-IP object takes the full path of an object that already exists on the BIG-IP, for
                          example `/Common/my_irule`. The agent never creates nor changes those objects. A path to a missing object makes the
                          BIG-IP refuse the partition of the virtual server, reported as an error on the virtual server.
                        properties:
                          auto:
                            description: Translate to a self IP of the BIG-IP (automap).
                            type: boolean
                          clientTLSProfile:
                            description: |-
                              Client SSL profile, facing the clients, replacing the one the agent builds from the certificates of the virtual
                              server.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          fallbackPersistenceProfile:
                            description: Persistence profile used when the persistence
                              profile can't find a record.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          httpProfile:
                            description: HTTP profile of an http virtual server, replacing
                              the default one.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          irules:
                            description: iRules attached to the virtual server after
                              the iRules the agent generates.
                            items:
                              maxLength: 255
                              pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                              type: string
                            maxItems: 64
                            type: array
                            x-kubernetes-list-type: atomic
                          none:
                            description: Keep the client address. The endpoints must
                              route their answers back through the BIG-IP.
                            type: boolean
                          persistenceProfile:
                            description: |-
                              Persistence profile of the virtual server. Without it the virtual server has no persistence, unless its backend
                              uses a consistent hash lb_policy.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          pool:
                            description: Translate to the addresses of an existing
                              SNAT pool, given by full path.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          serverTLSProfile:
                            description: Server SSL profile, facing the endpoints,
                              replacing the one the agent builds from the TLS settings
                              of the backend.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          tcpProfile:
                            description: TCP profile, replacing the default one, for
                              tcp, http and tls over tcp virtual servers.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          udpProfile:
                            description: UDP profile, replacing the default one, for
                              udp virtual servers.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                          wafPolicy:
                            description: WAF (Advanced WAF) policy of the virtual
                              server.
                            maxLength: 255
                            pattern: ^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: at most one of auto, none, pool can be set
                          rule: '[has(self.auto), has(self.none), has(self.pool)].filter(x,
                            x).size() <= 1'
                      starling:
                        description: |-
                          HttpOptions holds the starling agent options of an http virtual server, packed in the `typed_options` field of
                          `flock.api.config.vs.v1.HttpRoutesConfig`. They configure the envoy HTTP connection manager serving the virtual
                          server, so they apply to every virtual host of it.

                          Virtual servers sharing a port of a VIP must all have the same `disable_snat` and `disable_dnat`, because they apply
                          to the whole port. A virtual server that differs is not served on the port.
                        properties:
                          codecType:
                            description: CodecType is the HTTP version accepted from
                              clients, AUTO by default.
                            enum:
                            - Auto
                            - HTTP1
                            - HTTP2
                            type: string
                          commonHTTPProtocolOptions:
                            description: |-
                              CommonHttpProtocolOptions apply to the client connections, whatever their HTTP version. The idle timeout is 1 hour
                              when unset. Requests with an underscore in a header name are always rejected.
                            properties:
                              idleTimeoutMilliseconds:
                                description: |-
                                  IdleTimeout closes a connection after this time without any active request. HTTP/2 PINGs don't keep the connection
                                  alive. It is 1 hour when unset, and 0 disables it, which may leak connections whose TCP FIN was lost. An HTTP/2
                                  client connection is drained before it is closed.
                                format: int32
                                type: integer
                              maxConnectionDurationMilliseconds:
                                description: |-
                                  MaxConnectionDuration closes a connection this long after it was established. A connection without active stream
                                  is closed at once, a client connection with active streams is drained first and closed at the end of the drain.
                                  There is no maximum when unset.
                                format: int32
                                type: integer
                              maxHeadersCount:
                                description: |-
                                  MaxHeadersCount is the maximum number of headers of a request, 100 when unset. A request with more headers is
                                  answered 431 in HTTP/1 and its stream is reset in HTTP/2.
                                format: int32
                                minimum: 1
                                type: integer
                              maxRequestsPerConnection:
                                description: |-
                                  MaxRequestsPerConnection is the maximum number of requests sent over one connection, no limit when unset. 1
                                  disables keep alive. In HTTP/2 and HTTP/3 the limit is approximate because streams run concurrently.
                                format: int32
                                minimum: 0
                                type: integer
                              maxStreamDurationMilliseconds:
                                description: |-
                                  MaxStreamDuration resets a stream this long after it started, whatever the other timeouts. There is no maximum
                                  when unset.
                                format: int32
                                type: integer
                            required:
                            - maxHeadersCount
                            type: object
                          disableDnat:
                            description: DisableDnat adds envoy's `original_dst` listener
                              filter.
                            type: boolean
                          disableSnat:
                            description: |-
                              DisableSnat adds envoy's `original_src` listener filter, so envoy connects to the backends with the client address
                              as source and the backends must route their replies back through the agent. The agent setting
                              `advertisement.disable_snat` has the same effect on every envoy listener.
                            type: boolean
                          http2ProtocolOptions:
                            description: |-
                              Http2ProtocolOptions apply to the HTTP/2 client connections. When unset, or for the fields left unset, the agent
                              uses at most 1000000 concurrent streams, an initial stream window of 65536 bytes and an initial connection window
                              of 1048576 bytes.
                            properties:
                              allowConnect:
                                description: AllowConnect allows proxying websockets
                                  and other upgrades over HTTP/2 CONNECT.
                                type: boolean
                              connectionKeepalive:
                                description: ConnectionKeepalive sends PING frames
                                  to check the connection, and closes it when the
                                  peer doesn't answer in time.
                                properties:
                                  connectionIdleIntervalMilliseconds:
                                    description: |-
                                      ConnectionIdleInterval would send a PING before a new stream on a connection idle for this long. The starling
                                      agent doesn't pass it to envoy, so it has no effect.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                  intervalMilliseconds:
                                    description: Interval is the period of the PING
                                      frames, at least 1ms. No periodic PING is sent
                                      when unset.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                  timeoutMilliseconds:
                                    description: |-
                                      Timeout is how long to wait for the answer to a PING before closing the connection, at least 1ms. Any frame
                                      received on the connection extends the wait, so head-of-line blocking doesn't close a healthy connection.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                required:
                                - connectionIdleIntervalMilliseconds
                                - intervalMilliseconds
                                - timeoutMilliseconds
                                type: object
                              hpackTableSize:
                                description: |-
                                  HpackTableSize is the maximum size in bytes of the HPACK dynamic table the encoder may use
                                  (https://httpwg.org/specs/rfc7541.html#rfc.section.4.2), 4096 when unset. 0 disables header compression.
                                format: int32
                                minimum: 0
                                type: integer
                              initialConnectionWindowSize:
                                description: |-
                                  InitialConnectionWindowSize is the initial flow control window of a connection in bytes, from 65535 to 2147483647.
                                  The starling agent uses 1048576 when unset.
                                format: int32
                                maximum: 2147483647
                                minimum: 65535
                                type: integer
                              initialStreamWindowSize:
                                description: |-
                                  InitialStreamWindowSize is the initial flow control window of a stream in bytes
                                  (https://httpwg.org/specs/rfc7540.html#rfc.section.6.9.2), from 65535 to 2147483647. The starling agent uses 65536
                                  when unset. It also bounds the bytes envoy buffers per stream in its HTTP/2 codec.
                                format: int32
                                maximum: 2147483647
                                minimum: 65535
                                type: integer
                              maxConcurrentStreams:
                                description: |-
                                  MaxConcurrentStreams is the maximum number of concurrent streams of one connection
                                  (https://httpwg.org/specs/rfc7540.html#rfc.section.5.1.2), from 1 to 2147483647. When unset it is 1000000 for the
                                  client connections of an http virtual server, and 2147483647 toward a backend.

                                  Toward a backend it also limits the streams envoy opens on one connection. Over the limit, envoy queues the
                                  requests or opens more connections. Envoy lowers it on a connection when the backend announces a lower limit.
                                format: int32
                                maximum: 2147483647
                                minimum: 1
                                type: integer
                              maxConsecutiveInboundFramesWithEmptyPayload:
                                description: |-
                                  MaxConsecutiveInboundFramesWithEmptyPayload is the maximum number of consecutive HEADERS, CONTINUATION and DATA
                                  frames received with an empty payload and no end of stream flag, 1 when unset. Over it, envoy closes the connection
                                  as a flood and counts it in `http2.inbound_empty_frames_flood`. 0 closes the connection on the first such frame.
                                format: int32
                                minimum: 0
                                type: integer
                              maxInboundPriorityFramesPerStream:
                                description: |-
                                  MaxInboundPriorityFramesPerStream limits the PRIORITY frames received, 100 when unset. Envoy closes the connection
                                  as a flood, counted in `http2.inbound_priority_frames_flood`, when the PRIORITY frames received over its lifetime
                                  exceed `max_inbound_priority_frames_per_stream * (1 + opened_streams)`. On a client connection `opened_streams`
                                  grows when envoy receives the complete response headers from the backend. On a connection to a backend it grows
                                  when envoy sends the HEADERS frame of a new stream.
                                format: int32
                                minimum: 0
                                type: integer
                              maxInboundWindowUpdateFramesPerDataFrameSent:
                                description: |-
                                  MaxInboundWindowUpdateFramesPerDataFrameSent limits the WINDOW_UPDATE frames received, 10 when unset. Envoy closes
                                  the connection as a flood, counted in `http2.inbound_window_update_frames_flood`, when the WINDOW_UPDATE frames
                                  received over its lifetime exceed
                                  `5 + 2 * (opened_streams + max_inbound_window_update_frames_per_data_frame_sent * outbound_data_frames)`, with
                                  `opened_streams` counted as for `max_inbound_priority_frames_per_stream`. 1 is enough for peers with basic flow
                                  control, peers estimating the available bandwidth need at least 2.
                                format: int32
                                minimum: 1
                                type: integer
                              maxOutboundControlFrames:
                                description: |-
                                  MaxOutboundControlFrames is the maximum number of PING, SETTINGS and RST_STREAM frames waiting to be written to the
                                  socket, 1000 when unset. Over it, envoy closes the connection as a flood and counts it in
                                  `http2.outbound_control_flood`.
                                format: int32
                                minimum: 1
                                type: integer
                              maxOutboundFrames:
                                description: |-
                                  MaxOutboundFrames is the maximum number of frames of any type waiting to be written to the socket, 10000 when
                                  unset. Over it, envoy closes the connection as a flood and counts it in `http2.outbound_flood`.
                                format: int32
                                minimum: 1
                                type: integer
                            required:
                            - initialConnectionWindowSize
                            - initialStreamWindowSize
                            - maxConcurrentStreams
                            - maxInboundWindowUpdateFramesPerDataFrameSent
                            - maxOutboundControlFrames
                            - maxOutboundFrames
                            type: object
                          http3ProtocolOptions:
                            description: |-
                              Http3ProtocolOptions is passed to envoy, but the listeners of the starling agent accept no HTTP/3 connection and
                              `codec_type` has no HTTP/3 value, so it has no effect.
                            properties:
                              allowExtendedConnect:
                                description: |-
                                  AllowExtendedConnect allows proxying websockets and other upgrades over HTTP/3 CONNECT, with the headers of the
                                  HTTP/2 extended CONNECT (RFC 8441) and the settings proposed for HTTP/3
                                  (https://datatracker.ietf.org/doc/draft-ietf-httpbis-h3-websockets/), which is not an RFC yet.
                                type: boolean
                              overrideStreamErrorOnInvalidHTTPMessage:
                                description: |-
                                  OverrideStreamErrorOnInvalidHttpMessage only terminates the offending stream on an invalid HEADERS frame when
                                  true. When false or unset, the whole connection is terminated.
                                type: boolean
                              quicProtocolOptions:
                                description: QuicProtocolOptions are the QUIC options
                                  of the connection.
                                properties:
                                  connectionKeepalive:
                                    description: |-
                                      ConnectionKeepalive probes the peer to get traffic back from it and push back the idle timeout of the connection.
                                      When unset, a client connection sends a PING every 15s and a server connection doesn't probe.
                                    properties:
                                      initialIntervalMilliseconds:
                                        description: |-
                                          InitialInterval is the interval of the first probes, 0 or at least 1s. Each next probe waits exponentially longer,
                                          up to `max_interval`. It should be shorter than the idle timeout of the connection and than `max_interval`. When
                                          unset or 0, a server connection doesn't probe, and a client connection probes at `max_interval` (or the QUICHE
                                          default) unless `max_interval` is 0.
                                        format: int32
                                        type: integer
                                        x-kubernetes-validations:
                                        - message: must be <= 0 or >= 1000
                                          rule: self <= 0 || self >= 1000
                                      maxIntervalMilliseconds:
                                        description: |-
                                          MaxInterval is the longest interval between two probes (PING or PATH_RESPONSE), 0 or at least 1s. It should be
                                          shorter than the idle timeout of the connection. A client connection starts probing at this interval when
                                          `initial_interval` is unset or 0. 0 disables probing, and the QUICHE default interval is used when unset.
                                        format: int32
                                        type: integer
                                        x-kubernetes-validations:
                                        - message: must be <= 0 or >= 1000
                                          rule: self <= 0 || self >= 1000
                                    type: object
                                  initialConnectionWindowSize:
                                    description: |-
                                      InitialConnectionWindowSize is the initial flow control receive window of a connection in bytes, from 1 to
                                      25165824, 65536 when unset.
                                    format: int32
                                    maximum: 25165824
                                    minimum: 1
                                    type: integer
                                  initialStreamWindowSize:
                                    description: |-
                                      InitialStreamWindowSize is the initial flow control receive window of a stream in bytes
                                      (https://tools.ietf.org/html/draft-ietf-quic-transport-34#section-4.1), from 1 to 16777216, 65536 when unset. It
                                      also bounds the bytes envoy buffers per stream in the QUIC stream buffers.
                                    format: int32
                                    maximum: 16777216
                                    minimum: 1
                                    type: integer
                                  maxConcurrentStreams:
                                    description: MaxConcurrentStreams is the maximum
                                      number of streams the client can negotiate per
                                      connection, 100 when unset.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                  numTimeoutsToTriggerPortMigration:
                                    description: |-
                                      NumTimeoutsToTriggerPortMigration is the number of QUIC path degrading timeouts (such as PTO) before a client
                                      connection migrates to another port, from 0 to 5, 1 when unset. 0 disables the migration. It has no effect on
                                      server connections.
                                    format: int32
                                    maximum: 5
                                    minimum: 0
                                    type: integer
                                required:
                                - initialConnectionWindowSize
                                - initialStreamWindowSize
                                - maxConcurrentStreams
                                type: object
                            type: object
                          httpProtocolOptions:
                            description: HttpProtocolOptions apply to the HTTP/1 client
                              connections.
                            properties:
                              enableTrailers:
                                description: |-
                                  EnableTrailers proxies the HTTP/1 trailers, which are dropped otherwise. Envoy only sends trailers when it chunk
                                  encodes the message, which happens when all of these hold:
                                  - the request is HTTP/1.1
                                  - the request is neither a HEAD request nor an HTTP upgrade
                                  - the message is not the response to a HEAD request
                                  - the message has no content-length header
                                type: boolean
                              sendFullyQualifiedURL:
                                description: |-
                                  SendFullyQualifiedUrl puts the scheme (inferred when missing) and the host (host or `:authority` header) before the
                                  path in the request line sent to the backend. By default only the path is sent.
                                type: boolean
                            type: object
                          requestHeadersToAdd:
                            description: RequestHeadersToAdd are added to each request
                              before it is sent to a backend, at most 1000.
                            items:
                              description: Header name/value pair plus option to control
                                append behavior.
                              properties:
                                append:
                                  description: |-
                                    When true, the value is added next to the existing values of the header. When false (default), it replaces
                                    them.
                                  type: boolean
                                header:
                                  description: Header name/value pair that this option
                                    applies to.
                                  properties:
                                    key:
                                      description: Header name.
                                      maxLength: 16384
                                      minLength: 1
                                      pattern: ^[^\x00\x0A\x0D]+$
                                      type: string
                                    value:
                                      description: Header value.
                                      maxLength: 16384
