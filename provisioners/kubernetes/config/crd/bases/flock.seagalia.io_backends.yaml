---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: backends.flock.seagalia.io
spec:
  group: flock.seagalia.io
  names:
    kind: Backend
    listKind: BackendList
    plural: backends
    singular: backend
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Backend is the flock backend of the same name, its spec converted
          by ToProto.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Backend
            properties:
              ca:
                description: |-
                  PEM CA used to verify the certificates of the endpoints, for TLS connections and TLS health checks. When empty,
                  the system CAs of the agent are used.
                maxLength: 65536
                type: string
              connectTimeoutMilliseconds:
                description: Timeout to establish a connection to an endpoint. When
                  unset, the agent applies its own default.
                format: int32
                type: integer
              dns:
                description: Endpoints resolved from a DNS name.
                properties:
                  host:
                    description: The DNS name to resolve.
                    maxLength: 253
                    minLength: 1
                    type: string
                  lookupFamily:
                    description: The DNS lookup family to use when resolving the host.
                      Defaults to V6_PREFERRED.
                    enum:
                    - V6Preferred
                    - V4Preferred
                    - V4Only
                    - V6Only
                    - All
                    type: string
                  nameservers:
                    description: |-
                      DNS servers to query, tried in order until one gives an answer. When empty, the agent uses the DNS servers of its
                      host.
                    items:
                      description: |-
                        IPAddr represents an IP address and port.
                        Optionally a weight can be set for weighted load balancing policy.
                      properties:
                        ip:
                          description: IPv4 or IPv6 address.
                          maxLength: 45
                          type: string
                          x-kubernetes-validations:
                          - message: must be an IP address
                            rule: isIP(self)
                        loadBalancingWeight:
                          description: |-
                            Weight of the endpoint for weighted load balancing policies. 0 (default) gives the endpoint the default weight
                            of the agent, it never stops the traffic to the endpoint.
                          format: int32
                          minimum: 0
                          type: integer
                        port:
                          description: Port number.
                          exclusiveMinimum: true
                          format: int32
                          maximum: 65535
                          minimum: 0
                          type: integer
                      required:
                      - ip
                      - port
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  port:
                    description: Port of the endpoints, the same for every address
                      found.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - host
                - port
                type: object
              eds:
                description: Endpoints given by a discovery server.
                properties:
                  ca:
                    description: PEM CA used to verify the certificate of the discovery
                      server. When empty, the system CAs of the agent are used.
                    maxLength: 65536
                    type: string
                  headers:
                    description: HTTP headers (gRPC metadata for a gRPC server) added
                      to each query.
                    items:
                      description: Header name/value pair.
                      properties:
                        key:
                          description: Header name.
                          maxLength: 16384
                          minLength: 1
                          pattern: ^[^\x00\x0A\x0D]+$
                          type: string
                        value:
                          description: Header value.
                          maxLength: 16384
                          pattern: ^[^\x00\x0A\x0D]+$
                          type: string
                        valueFromSecret:
                          description: |-
                            Value of a secret, for a header carrying a credential such as `Authorization`. Agents send the value of the
                            secret, an empty value until they hold the secret.
                          properties:
                            key:
                              description: Key of the value in the data of the secret.
                              maxLength: 253
                              minLength: 1
                              type: string
                            secretRef:
                              description: UUID of the secret.
                              properties:
                                name:
                                  description: name of the object.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                  type: string
                              required:
                              - name
                              type: object
                          required:
                          - key
                          - secretRef
                          type: object
                      required:
                      - key
                      type: object
                      x-kubernetes-validations:
                      - message: at most one of value, valueFromSecret can be set
                        rule: '[has(self.value), has(self.valueFromSecret)].filter(x,
                          x).size() <= 1'
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  serviceName:
                    description: |-
                      Name of the service to get the endpoints of, sent as the `service_name` query parameter or request field.
                      When empty, the http query has no `service_name` parameter.
                    maxLength: 253
                    type: string
                  url:
                    description: |-
                      URL of the discovery server. Its scheme is http, https, grpc or grpcs. With grpc and grpcs, the path is a prefix put
                      before the procedure, for a server behind a reverse proxy, so `grpc://vigie:8080` is the usual form and a url that
                      keeps `/services` fails with `Unimplemented`. Its user info is sent as basic auth, the password taken from a
                      secret.
                    properties:
                      host:
                        description: Host name or IP address, without port.
                        maxLength: 253
                        minLength: 1
                        type: string
                      path:
                        description: Path of the URL, appended right after the host
                          and port, so it starts with `/`.
                        maxLength: 2048
                        type: string
                      port:
                        description: Port. 0 (default) leaves it out of the URL, so
                          the default port of the scheme applies.
                        format: int32
                        minimum: 0
                        type: integer
                      scheme:
                        description: Scheme of the URL, e.g. `https`.
                        maxLength: 16
                        minLength: 1
                        type: string
                      userInfo:
                        description: Credentials sent as HTTP basic auth. Empty sends
                          none.
                        properties:
                          passwordFromSecret:
                            description: Value of a secret used as the password.
                            properties:
                              key:
                                description: Key of the value in the data of the secret.
                                maxLength: 253
                                minLength: 1
                                type: string
                              secretRef:
                                description: UUID of the secret.
                                properties:
                                  name:
                                    description: name of the object.
                                    maxLength: 253
                                    minLength: 1
                                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                    type: string
                                required:
                                - name
                                type: object
                            required:
                            - key
                            - secretRef
                            type: object
                          user:
                            description: User name.
                            maxLength: 256
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: a password needs a user
                          rule: '!has(self.passwordFromSecret) || (has(self.user)
                            && self.user.size() > 0)'
                    required:
                    - host
                    - scheme
                    type: object
                    x-kubernetes-validations:
                    - message: scheme must be http, https, grpc or grpcs
                      rule: self.scheme in ['http', 'https', 'grpc', 'grpcs']
                type: object
              enableProxyProtocol:
                description: Send a proxy protocol header to the endpoints at the
                  start of each connection, so they get the client address.
                type: boolean
              enableTLS:
                description: |-
                  Connect to the endpoints with TLS. It applies to routes the agent proxies, a route forwarding packets unchanged to
                  the endpoints ignores it.
                type: boolean
              healthCheck:
                description: Health check run by the agent on every endpoint. Traffic
                  only goes to the endpoints it reports healthy.
                properties:
                  altPort:
                    description: |-
                      Port to health check instead of the endpoint's own port. 0 (default) checks the endpoint port.
                      The UDP health check with `receive` set ignores it.
                    format: int32
                    minimum: 0
                    type: integer
                  enableTLS:
                    description: |-
                      Runs the health check over TLS, verified with the `ca` and `sni` of the backend. Applies to the HTTP, TCP and gRPC
                      health checks and is passed to plugins. The UDP health check ignores it. Defaults to false.
                    type: boolean
                  grpcHealthCheck:
                    description: gRPC health check.
                    properties:
                      authority:
                        description: The value of the :authority header in the gRPC
                          health check request.
                        maxLength: 253
                        pattern: ^[^\x00\x0A\x0D]+$
                        type: string
                      serviceName:
                        description: |-
                          An optional service name parameter which will be sent to gRPC service in
                          `grpc.health.v1.HealthCheckRequest
                          <https://github.com/grpc/grpc/blob/master/src/proto/grpc/health/v1/health.proto#L20>`_.
                          message. See `gRPC health-checking overview
                          <https://github.com/grpc/grpc/blob/master/doc/health-checking.md>`_ for more information.
                        maxLength: 253
                        type: string
                    type: object
                  healthyThreshold:
                    description: |-
                      The number of successful health checks required before an unhealthy host is marked
                      healthy again. Note that during startup, only a single successful health check is
                      required to mark a host healthy.
                      Defaults to 1 if not specified.
                    exclusiveMinimum: true
                    format: int32
                    minimum: 0
                    type: integer
                  httpHealthCheck:
                    description: HTTP health check.
                    properties:
                      codecClientType:
                        description: Use specified application protocol for health
                          checks. Defaults to HTTP1.
                        enum:
                        - HTTP1
                        - HTTP2
                        - HTTP3
                        type: string
                      expectedStatuses:
                        description: |-
                          Range of HTTP response statuses considered healthy, following the half-open semantics of
                          Int64Range (start included, end excluded).
                          Defaults to [200, 300).
                        properties:
                          end:
                            description: End of the range, exclusive.
                            format: int64
                            maximum: 9007199254740991
                            minimum: -9007199254740991
                            type: integer
                          start:
                            description: Start of the range, inclusive.
                            format: int64
                            maximum: 9007199254740991
                            minimum: -9007199254740991
                            type: integer
                        type: object
                      host:
                        description: |-
                          The value of the host header in the HTTP health check request. If
                          left empty (default value), the endpoint address (`ip:port`) is used.
                        maxLength: 253
                        pattern: ^[^\x00\x0A\x0D]+$
                        type: string
                      method:
                        description: |-
                          HTTP Method that will be used for health checking, default is "GET".
                          GET, HEAD, POST, PUT, DELETE, OPTIONS, TRACE, PATCH methods are supported, the body comes from `send`.
                          CONNECT method is disallowed because it is not appropriate for health check request.
                          If a response outside [200, 300) is expected by the method, it needs to be set in expected_statuses.
                        enum:
                        - GET
                        - HEAD
                        - POST
                        - PUT
                        - DELETE
                        - CONNECT
                        - OPTIONS
                        - TRACE
                        - PATCH
                        type: string
                        x-kubernetes-validations:
                        - message: must not be one of CONNECT
                          rule: '!(self in ["CONNECT"])'
                      path:
                        description: |-
                          Specifies the HTTP path that will be requested during health checking. For example
                          */healthcheck*. Defaults to `/`.
                        maxLength: 2048
                        minLength: 1
                        pattern: ^[^\x00\x0A\x0D]+$
                        type: string
                      receive:
                        description: When set, the response body must contain these
                          bytes for the check to succeed.
                        properties:
                          binary:
                            description: Binary payload.
                            format: byte
                            maxLength: 5464
                            type: string
                          text:
                            description: Text payload, used as its UTF-8 bytes.
                            maxLength: 4096
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of text, binary must be set
                          rule: '[has(self.text), has(self.binary)].exists_one(x,
                            x)'
                      requestHeadersToAdd:
                        description: |-
                          Specifies a list of HTTP headers that should be added to each request that is sent to the
                          health checked backend.
                        items:
                          description: Header name/value pair plus option to control
                            append behavior.
                          properties:
                            append:
                              description: |-
                                When true, the value is added next to the existing values of the header. When false (default), it replaces
                                them.
                              type: boolean
                            header:
                              description: Header name/value pair that this option
                                applies to.
                              properties:
                                key:
                                  description: Header name.
                                  maxLength: 16384
                                  minLength: 1
                                  pattern: ^[^\x00\x0A\x0D]+$
                                  type: string
                                value:
                                  description: Header value.
                                  maxLength: 16384
                                  pattern: ^[^\x00\x0A\x0D]+$
                                  type: string
                                valueFromSecret:
                                  description: |-
                                    Value of a secret, for a header carrying a credential such as `Authorization`. Agents send the value of the
                                    secret, an empty value until they hold the secret.
                                  properties:
                                    key:
                                      description: Key of the value in the data of
                                        the secret.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    secretRef:
                                      description: UUID of the secret.
                                      properties:
                                        name:
                                          description: name of the object.
                                          maxLength: 253
                                          minLength: 1
                                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                          type: string
                                      required:
                                      - name
                                      type: object
                                  required:
                                  - key
                                  - secretRef
                                  type: object
                              required:
                              - key
                              type: object
                              x-kubernetes-validations:
                              - message: at most one of value, valueFromSecret can
                                  be set
                                rule: '[has(self.value), has(self.valueFromSecret)].filter(x,
                                  x).size() <= 1'
                          required:
                          - header
                          type: object
                        maxItems: 1000
                        type: array
                        x-kubernetes-list-type: atomic
                      send:
                        description: Body of the health check request. Empty (default)
                          sends no body.
                        properties:
                          binary:
                            description: Binary payload.
                            format: byte
                            maxLength: 5464
                            type: string
                          text:
                            description: Text payload, used as its UTF-8 bytes.
                            maxLength: 4096
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of text, binary must be set
                          rule: '[has(self.text), has(self.binary)].exists_one(x,
                            x)'
                    type: object
                  intervalMilliseconds:
                    description: |-
                      The interval between health checks of an endpoint.
                      Defaults to 10s if not specified.
                    exclusiveMinimum: true
                    format: int32
                    minimum: 0
                    type: integer
                  noHealthCheck:
                    description: No health check, every endpoint is considered healthy.
                    type: object
                  pluginHealthCheck:
                    description: Health check run by a program declared in the agent
                      configuration.
                    properties:
                      name:
                        description: |-
                          The name of the plugin to use for health checking, as declared in the agent configuration. The check fails when
                          the agent has no plugin of that name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      options:
                        description: The options to pass to the plugin.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                    - name
                    type: object
                  tcpHealthCheck:
                    description: TCP health check.
                    properties:
                      receive:
                        description: |-
                          Blocks the response must start with, read one after the other. Each one must match the next bytes received
                          exactly, waiting up to `timeout` for them. Empty skips the response check.
                        items:
                          description: Bytes sent or expected by a health check, given
                            as text or as binary. Exactly one must be set.
                          properties:
                            binary:
                              description: Binary payload.
                              format: byte
                              maxLength: 5464
                              type: string
                            text:
                              description: Text payload, used as its UTF-8 bytes.
                              maxLength: 4096
                              minLength: 1
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of text, binary must be set
                            rule: '[has(self.text), has(self.binary)].exists_one(x,
                              x)'
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                      send:
                        description: Bytes written once connected. Empty payloads
                          imply a connect-only health check.
                        properties:
                          binary:
                            description: Binary payload.
                            format: byte
                            maxLength: 5464
                            type: string
                          text:
                            description: Text payload, used as its UTF-8 bytes.
                            maxLength: 4096
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of text, binary must be set
                          rule: '[has(self.text), has(self.binary)].exists_one(x,
                            x)'
                    type: object
                  timeoutMilliseconds:
                    description: |-
                      The time to wait for a health check response. If the timeout is reached the
                      health check attempt will be considered a failure.
                      Defaults to 30s if not specified.
                    exclusiveMinimum: true
                    format: int32
                    minimum: 0
                    type: integer
                  udpHealthCheck:
                    description: UDP health check.
                    properties:
                      delayMilliseconds:
                        description: Delay is how long each read of the ICMP socket
                          waits before reading again, in the weak method. Defaults
                          to 1s.
                        exclusiveMinimum: true
                        format: int32
                        minimum: 0
                        type: integer
                      pingTimeoutMilliseconds:
                        description: PingTimeout specifies the timeout of the ICMP
                          ping of the weak method. Defaults to 5s.
                        exclusiveMinimum: true
                        format: int32
                        minimum: 0
                        type: integer
                      receive:
                        description: |-
                          Expected datagrams. Each block is read from the next datagram received, waiting up to `timeout`, and must equal
                          its first bytes.
                        items:
                          description: Bytes sent or expected by a health check, given
                            as text or as binary. Exactly one must be set.
                          properties:
                            binary:
                              description: Binary payload.
                              format: byte
                              maxLength: 5464
                              type: string
                            text:
                              description: Text payload, used as its UTF-8 bytes.
                              maxLength: 4096
                              minLength: 1
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of text, binary must be set
                            rule: '[has(self.text), has(self.binary)].exists_one(x,
                              x)'
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: atomic
                      send:
                        description: Payload to send. Something is always sent, so
                          the agent sends a default payload when it is left empty.
                        properties:
                          binary:
                            description: Binary payload.
                            format: byte
                            maxLength: 5464
                            type: string
                          text:
                            description: Text payload, used as its UTF-8 bytes.
                            maxLength: 4096
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of text, binary must be set
                          rule: '[has(self.text), has(self.binary)].exists_one(x,
                            x)'
                    type: object
                  unhealthyIntervalMilliseconds:
                    description: |-
                      The "unhealthy interval" is a health check interval that is used for hosts that are marked as
                      unhealthy. As soon as the host is marked as healthy, Flock will shift back to using the
                      standard health check interval that is defined.

                      The default value for "unhealthy interval" is the same as "interval".
                    exclusiveMinimum: true
                    format: int32
                    minimum: 0
                    type: integer
                  unhealthyThreshold:
                    description: |-
                      The number of consecutive failed health checks required before a host is marked
                      unhealthy.
                      Defaults to 3 if not specified.
                    exclusiveMinimum: true
                    format: int32
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: exactly one of httpHealthCheck, tcpHealthCheck, grpcHealthCheck,
                    noHealthCheck, pluginHealthCheck, udpHealthCheck must be set
                  rule: '[has(self.httpHealthCheck), has(self.tcpHealthCheck), has(self.grpcHealthCheck),
                    has(self.noHealthCheck), has(self.pluginHealthCheck), has(self.udpHealthCheck)].exists_one(x,
                    x)'
              httpProtocolOptions:
                description: |-
                  HttpProtocolOptions specifies Http upstream protocol options.
                  It only applies to http virtual server type.
                  This is an extension point for any load balancer specific options.
                  valid extensions are:
                  - flock.extensions.common.starling_options.v1.HttpProtocolOptions
                properties:
                  starling:
                    description: |-
                      HttpProtocolOptions sets the HTTP protocol envoy uses toward the endpoints of a backend, packed in the
                      `http_protocol_options` field of `flock.api.config.backend.v1.Backend`. The starling agent passes it to envoy as the
                      HTTP protocol options of the envoy cluster of the backend. When the field is unset, envoy speaks HTTP/1.1 to the
                      backend. It only matters for the traffic envoy proxies over HTTP, i.e. the routes of http virtual servers.
                    properties:
                      autoConfig:
                        description: AutoConfig uses the protocol negotiated by ALPN
                          with the backend.
                        properties:
                          http2ProtocolOptions:
                            description: Http2ProtocolOptions are the options used
                              when HTTP/2 is negotiated.
                            properties:
                              allowConnect:
                                description: AllowConnect allows proxying websockets
                                  and other upgrades over HTTP/2 CONNECT.
                                type: boolean
                              connectionKeepalive:
                                description: ConnectionKeepalive sends PING frames
                                  to check the connection, and closes it when the
                                  peer doesn't answer in time.
                                properties:
                                  connectionIdleIntervalMilliseconds:
                                    description: |-
                                      ConnectionIdleInterval would send a PING before a new stream on a connection idle for this long. The starling
                                      agent doesn't pass it to envoy, so it has no effect.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                  intervalMilliseconds:
                                    description: Interval is the period of the PING
                                      frames, at least 1ms. No periodic PING is sent
                                      when unset.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                  timeoutMilliseconds:
                                    description: |-
                                      Timeout is how long to wait for the answer to a PING before closing the connection, at least 1ms. Any frame
                                      received on the connection extends the wait, so head-of-line blocking doesn't close a healthy connection.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                required:
                                - connectionIdleIntervalMilliseconds
                                - intervalMilliseconds
                                - timeoutMilliseconds
                                type: object
                              hpackTableSize:
                                description: |-
                                  HpackTableSize is the maximum size in bytes of the HPACK dynamic table the encoder may use
                                  (https://httpwg.org/specs/rfc7541.html#rfc.section.4.2), 4096 when unset. 0 disables header compression.
                                format: int32
                                minimum: 0
                                type: integer
                              initialConnectionWindowSize:
                                description: |-
                                  InitialConnectionWindowSize is the initial flow control window of a connection in bytes, from 65535 to 2147483647.
                                  The starling agent uses 1048576 when unset.
                                format: int32
                                maximum: 2147483647
                                minimum: 65535
                                type: integer
                              initialStreamWindowSize:
                                description: |-
                                  InitialStreamWindowSize is the initial flow control window of a stream in bytes
                                  (https://httpwg.org/specs/rfc7540.html#rfc.section.6.9.2), from 65535 to 2147483647. The starling agent uses 65536
                                  when unset. It also bounds the bytes envoy buffers per stream in its HTTP/2 codec.
                                format: int32
                                maximum: 2147483647
                                minimum: 65535
                                type: integer
                              maxConcurrentStreams:
                                description: |-
                                  MaxConcurrentStreams is the maximum number of concurrent streams of one connection
                                  (https://httpwg.org/specs/rfc7540.html#rfc.section.5.1.2), from 1 to 2147483647. When unset it is 1000000 for the
                                  client connections of an http virtual server, and 2147483647 toward a backend.

                                  Toward a backend it also limits the streams envoy opens on one connection. Over the limit, envoy queues the
                                  requests or opens more connections. Envoy lowers it on a connection when the backend announces a lower limit.
                                format: int32
                                maximum: 2147483647
                                minimum: 1
                                type: integer
                              maxConsecutiveInboundFramesWithEmptyPayload:
                                description: |-
                                  MaxConsecutiveInboundFramesWithEmptyPayload is the maximum number of consecutive HEADERS, CONTINUATION and DATA
                                  frames received with an empty payload and no end of stream flag, 1 when unset. Over it, envoy closes the connection
                                  as a flood and counts it in `http2.inbound_empty_frames_flood`. 0 closes the connection on the first such frame.
                                format: int32
                                minimum: 0
                                type: integer
                              maxInboundPriorityFramesPerStream:
                                description: |-
                                  MaxInboundPriorityFramesPerStream limits the PRIORITY frames received, 100 when unset. Envoy closes the connection
                                  as a flood, counted in `http2.inbound_priority_frames_flood`, when the PRIORITY frames received over its lifetime
                                  exceed `max_inbound_priority_frames_per_stream * (1 + opened_streams)`. On a client connection `opened_streams`
                                  grows when envoy receives the complete response headers from the backend. On a connection to a backend it grows
