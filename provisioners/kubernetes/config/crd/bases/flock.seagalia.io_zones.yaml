---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: zones.flock.seagalia.io
spec:
  group: flock.seagalia.io
  names:
    kind: Zone
    listKind: ZoneList
    plural: zones
    singular: zone
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Zone is the flock zone of the same name, its spec converted by
          ToProto.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Zone
            properties:
              pools:
                description: |-
                  Pools are the named sets of IPs of the zone. After the creation of the zone, they change with the pool methods of
                  the Zone service only. A zone without pools is unmanaged and its VIPs can use any IP.
                items:
                  description: |-
                    IpPool is a named set of subnets and ip ranges from which the ipam picks the IP of a VIP. The subnets and ranges of
                    all the pools of a zone must not overlap.
                  properties:
                    ipRanges:
                      description: IpRanges from which an IP can be picked.
                      items:
                        description: |-
                          IpRange is an inclusive range of IP addresses of a pool. Both bounds are of the same IP family and ip_min is lower
                          than or equal to ip_max.
                        properties:
                          ipMax:
                            description: IpMax is the last IP address of the range,
                              included in it.
                            maxLength: 45
                            type: string
                            x-kubernetes-validations:
                            - message: must be an IP address
                              rule: isIP(self)
                          ipMin:
                            description: IpMin is the first IP address of the range.
                            maxLength: 45
                            type: string
                            x-kubernetes-validations:
                            - message: must be an IP address
                              rule: isIP(self)
                        required:
                        - ipMax
                        - ipMin
                        type: object
                      maxItems: 256
                      type: array
                      x-kubernetes-list-type: atomic
                    metadata:
                      additionalProperties:
                        type: string
                      description: Metadata of the pool. A pool selector without name
                        picks the first pool holding all the metadata it gives.
                      maxProperties: 64
                      type: object
                      x-kubernetes-validations:
                      - message: keys must be at most 253 characters
                        rule: self.all(k, k.size() <= 253)
                      - message: values must be at most 4096 characters
                        rule: self.all(k, self[k].size() <= 4096)
                    name:
                      description: Name of the pool, unique in the zone. A pool selector
                        given at VIP registration finds the pool by it.
                      maxLength: 253
                      minLength: 1
                      type: string
                    privacy:
                      description: Privacy level of the pool, PUBLIC by default.
                      enum:
                      - Public
                      - Private
                      type: string
                    subnets:
                      description: Subnets from which an IP can be picked.
                      items:
                        description: |-
                          Subnet is a CIDR of a pool. For an IPv4 subnet with a prefix length of 30 or less, the network and broadcast
                          addresses are never allocated.
                        properties:
                          ip:
                            description: IP is an IP address of the subnet, the host
                              bits are masked with the prefix length.
                            maxLength: 45
                            type: string
                            x-kubernetes-validations:
                            - message: must be an IP address
                              rule: isIP(self)
                          prefixLength:
                            description: PrefixLength is the prefix length of the
                              subnet, at most 32 for an IPv4 address and 128 for an
                              IPv6 one.
                            format: int32
                            maximum: 128
                            minimum: 0
                            type: integer
                        required:
                        - ip
                        type: object
                      maxItems: 256
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: subnets or ip_ranges must be set
                    rule: (has(self.subnets) && self.subnets.size() > 0) || (has(self.ipRanges)
                      && self.ipRanges.size() > 0)
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              zone:
                description: Zone is an arbitrary name of the real zone on your deployment.
                  It is only shown in listings.
                maxLength: 253
                type: string
            type: object
          status:
            description: status defines the observed state of Zone
            properties:
              conditions:
                description: conditions tell whether flock holds the spec of the object
                  (Ready) and why not when it doesn't.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation of the spec last
                  written to flock.
                format: int64
                minimum: 0
                type: integer
              uuid:
                description: uuid of the flock resource made from this object, empty
                  until it is created.
                maxLength: 36
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
