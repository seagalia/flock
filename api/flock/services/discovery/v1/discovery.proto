syntax = "proto3";

package flock.services.discovery.v1;

import "buf/validate/validate.proto";
import "flock/api/config/core/v1/base.proto";
import "flock/services/core/v1/filter.proto";
import "google/protobuf/any.proto";
import "google/rpc/status.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/services/discovery/v1;svcdiscovery";

// Resource is a resource of the instance sent to an agent.
message Resource {
  // The uuid of the resource.
  string uuid = 1 [(buf.validate.field).string.min_len = 1];
  // A hash of the content of the resource, it changes when the resource changes. The agent gives it back in
  // initial_resource_versions when it reconnects.
  string signature = 2 [(buf.validate.field).string.min_len = 1];

  // The resource itself, of the type_url the stream subscribed to.
  google.protobuf.Any resource = 3 [
    (buf.validate.field).any = {},
    (buf.validate.field).required = true
  ];
}

// DeltaDiscoveryRequest is a message an agent sends on the DeltaAggregatedResources stream. The first one
// subscribes, the next ones acknowledge each response.
message DeltaDiscoveryRequest {
  // The node sending the request. The controller reads it from the first request and only logs it.
  api.config.core.v1.Node node = 1;

  // The type url of the resources sent on this stream. Required in the first request (InvalidArgument otherwise).
  string type_url = 2;

  // The uuid of the instance whose resources are sent on this stream. Required in the first request, and the
  // instance must exist.
  string instance_uuid = 3;

  // The signature of each resource the agent already holds, by uuid, read from the first request. The controller
  // then only sends the resources that are missing or whose signature differs, and the uuids of those it no longer
  // has as removed_resources.
  map<string, string> initial_resource_versions = 4;

  // The response_nonce of the response this request acknowledges. A nonce that differs from the last response sent
  // ends the stream.
  string response_nonce = 5;

  // Set when the agent failed to apply the response it acknowledges. The controller logs it and ends the stream; on
  // the first snapshot the stream ends with this code and message.
  google.rpc.Status error_detail = 6;

  // Only the resources of type_url matching all these filters (on name, uuid or metadata) are sent on this stream.
  repeated core.v1.ListFilter filters = 7;
}

// DeltaDiscoveryResponse is a change of the resources of the stream the controller sends to the agent.
message DeltaDiscoveryResponse {
  // Resources created or updated, in full.
  repeated Resource resources = 1;
  // Uuids of the resources removed.
  repeated string removed_resources = 2;
  // Identifies this response. It is "0" for the first snapshot (sent only when the agent misses something) and
  // counts up from "1" for the next responses. The agent gives it back in response_nonce to acknowledge the response.
  string response_nonce = 3;
}

// AggregatedDiscovery is the service the controller sends the resources of an instance to its agents with.
service AggregatedDiscovery {
  // DeltaAggregatedResources opens a stream for one resource type of one instance, for agents authenticated by mTLS
  // only (PermissionDenied otherwise). The controller first sends the resources the agent misses, then a response
  // each time a resource of the stream changes or is removed. The agent must acknowledge each response within 3
  // minutes or the stream ends.
  rpc DeltaAggregatedResources(stream DeltaDiscoveryRequest) returns (stream DeltaDiscoveryResponse) {}
}
