syntax = "proto3";

package flock.services.backend.v1;

import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";
import "flock/api/config/backend/v1/backend.proto";
import "flock/services/core/v1/requests.proto";
import "flock/services/core/v1/filter.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/services/backend/v1;svcbackend";

// CreateBackendRequest is the request message for the CreateBackend method.
message CreateBackendRequest {
  // The backend to create. Its UUID is ignored, the controller generates one.
  flock.api.config.backend.v1.Backend backend = 1 [(buf.validate.field) = {required: true}];
}

// UpdateBackendRequest is the request message for the UpdateBackend method.
message UpdateBackendRequest {
  // The uuid of the backend to update.
  string UUID = 1 [(buf.validate.field).string = {min_len: 1}];
  // The new content of the backend, it replaces the stored one. Its UUID is ignored and set to the UUID above.
  flock.api.config.backend.v1.Backend backend = 2 [(buf.validate.field) = {required: true}];
}

// BackendResponse is the response message of the Backend methods returning one backend.
message BackendResponse {
  // The backend as stored by the controller, with its uuid.
  flock.api.config.backend.v1.Backend backend = 1 [(buf.validate.field) = {required: true}];
}

// ListBackendRequest is the request message for the ListBackend method.
message ListBackendRequest {
  // The maximum number of backends to return, 50 when 0.
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // The number of backends to skip before the first one returned, for paging.
  int32 offset = 2 [(buf.validate.field).int32 = {gte: 0}];
  // The filters the backends must match, see ListFilter.
  repeated core.v1.ListFilter filters = 3;
}

// ListBackendResponse is the response message for the ListBackend method.
message ListBackendResponse {
  // The backends of the page, empty when none matches.
  repeated flock.api.config.backend.v1.Backend backends = 1;
}

// Backend service provides the API to manage backends.
service Backend {
  // CreateBackend creates a new backend. A caller who is not admin becomes its owner.
  rpc CreateBackend(CreateBackendRequest)
      returns (BackendResponse) {
  }
  // ReadBackend returns the backend with the given uuid. It needs the reader role on the backend.
  rpc ReadBackend(flock.services.core.v1.UuidRequest)
      returns (BackendResponse) {
  }
  // UpdateBackend replaces the backend with the given uuid. It needs the writer role on the backend, and the owner
  // role when the name changes.
  rpc UpdateBackend(UpdateBackendRequest)
      returns (BackendResponse) {
  }
  // DeleteBackend deletes the backend with the given uuid. It needs the owner role on the backend and fails with
  // FailedPrecondition while a virtual server uses the backend.
  rpc DeleteBackend(flock.services.core.v1.UuidRequest)
      returns (google.protobuf.Empty) {
  }
  // ListBackend returns the backends the caller can read that match the filters. An admin gets every backend, or
  // those of the user given in the as_user header.
  rpc ListBackend(ListBackendRequest)
      returns (ListBackendResponse) {
  }
}
