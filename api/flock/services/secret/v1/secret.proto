syntax = "proto3";

package flock.services.secret.v1;

import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";
import "flock/api/config/secret/v1/secret.proto";
import "flock/services/core/v1/requests.proto";
import "flock/services/core/v1/filter.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/services/secret/v1;svcsecret";

// CreateSecretRequest is the request message for the CreateSecret method.
message CreateSecretRequest {
  // secret is the secret to create. Its UUID is ignored, the controller generates one.
  flock.api.config.secret.v1.Secret secret = 1 [(buf.validate.field) = {required: true}];
}

// UpdateSecretRequest is the request message for the UpdateSecret method.
message UpdateSecretRequest {
  // UUID is the uuid of the secret to update.
  string UUID = 1 [(buf.validate.field).string = {min_len: 1}];
  // secret is the new content of the secret, it replaces the stored one. Its UUID is ignored and set to UUID. A key
  // sent with an empty value keeps its stored value and a key left out is removed.
  flock.api.config.secret.v1.Secret secret = 2 [(buf.validate.field) = {required: true}];
}

// SecretResponse is the response message of the Secret methods returning one secret.
message SecretResponse {
  // secret is the secret as stored. Every method but RevealSecret leaves the values of its data empty.
  flock.api.config.secret.v1.Secret secret = 1 [(buf.validate.field) = {required: true}];
}

// ListSecretRequest is the request message for the ListSecret method.
message ListSecretRequest {
  // limit is the maximum number of secrets to return, 50 when 0.
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // offset is the number of secrets to skip before the first one returned, for paging.
  int32 offset = 2 [(buf.validate.field).int32 = {gte: 0}];
  // filters are the filters the secrets must match, see ListFilter.
  repeated core.v1.ListFilter filters = 3;
}

// ListSecretResponse is the response message for the ListSecret method.
message ListSecretResponse {
  // secrets are the secrets of the page, with the values of their data left empty.
  repeated flock.api.config.secret.v1.Secret secrets = 1 [(buf.validate.field).repeated = {min_items: 1}];
}

// Secret is the service definition for the Secret service.
service Secret {
  // CreateSecret creates a new secret. A caller who is not admin becomes the owner of the secret. The answer leaves
  // the values empty.
  rpc CreateSecret(CreateSecretRequest)
      returns (SecretResponse) {
  }
  // ReadSecret returns the secret with the given uuid, with the values of its data left empty. It needs the reader
  // role on the secret.
  rpc ReadSecret(flock.services.core.v1.UuidRequest)
      returns (SecretResponse) {
  }
  // RevealSecret returns the secret with the given uuid with its values. It needs the owner role on the secret. The
  // controller logs each call at info level with the caller and the uuid and name of the secret, never the values.
  rpc RevealSecret(flock.services.core.v1.UuidRequest)
      returns (SecretResponse) {
  }
  // UpdateSecret replaces the secret with the given uuid. It needs the writer role on the secret, and the owner role
  // when the name changes. A key sent with an empty value keeps its stored value, a key that was not stored needs a
  // value (InvalidArgument). Removing a key a resource points at fails with FailedPrecondition naming the resources.
  // The answer leaves the values empty.
  rpc UpdateSecret(UpdateSecretRequest)
      returns (SecretResponse) {
  }
  // DeleteSecret deletes the secret with the given uuid. It needs the owner role on the secret and fails with
  // FailedPrecondition, naming the resources, while a resource points at the secret.
  rpc DeleteSecret(flock.services.core.v1.UuidRequest)
      returns (google.protobuf.Empty) {
  }
  // ListSecret returns the secrets the caller can read that match the filters, with the values of their data left
  // empty. An admin gets every secret, or those of the user given in the as_user header.
  rpc ListSecret(ListSecretRequest)
      returns (ListSecretResponse) {
  }
}
