syntax = "proto3";

package flock.extensions.common.starling_options.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/extensions/common/starling_options/v1;starling_commopts";

// HttpProtocolOptions sets the HTTP protocol envoy uses toward the endpoints of a backend, packed in the
// `http_protocol_options` field of `flock.api.config.backend.v1.Backend`. The starling agent passes it to envoy as the
// HTTP protocol options of the envoy cluster of the backend. When the field is unset, envoy speaks HTTP/1.1 to the
// backend. It only matters for the traffic envoy proxies over HTTP, i.e. the routes of http virtual servers.
message HttpProtocolOptions {
  // ExplicitHttpConfig makes the backend use a single upstream protocol, chosen by the option set. HTTP/2 or above
  // should generally be used for gRPC backends.
  message ExplicitHttpConfig {
    // ProtocolConfig is the protocol used toward the backend and its options, one is required.
    oneof protocol_config {
      option (buf.validate.oneof).required = true;

      // HttpProtocolOptions selects HTTP/1.1.
      Http1ProtocolOptions http_protocol_options = 1;

      // Http2ProtocolOptions selects HTTP/2.
      Http2ProtocolOptions http2_protocol_options = 2;

      // Http3ProtocolOptions selects HTTP/3 (QUIC). The starling agent sets no QUIC transport socket on the envoy
      // cluster of a backend.
      Http3ProtocolOptions http3_protocol_options = 3;
    }
  }

  // UseDownstreamHttpConfig makes the backend use the protocol of the client connection, among the configured ones.
  message UseDownstreamHttpConfig {
    // HttpProtocolOptions are the options used when the client speaks HTTP/1.
    Http1ProtocolOptions http_protocol_options = 1;

    // Http2ProtocolOptions are the options used when the client speaks HTTP/2.
    Http2ProtocolOptions http2_protocol_options = 2;

    // Http3ProtocolOptions are the options used when the client speaks HTTP/3. The listeners of the starling agent
    // accept no HTTP/3 connection.
    Http3ProtocolOptions http3_protocol_options = 3;
  }

  // AutoHttpConfig makes the backend use HTTP/2 or HTTP/1.1, the one negotiated by ALPN with the backend. HTTP/2 is
  // used when the backend supports it, HTTP/1.1 otherwise or when the backend doesn't support ALPN. ALPN needs TLS
  // toward the backend (`enable_tls` of the backend), and envoy refuses the configuration without it. The ALPN offered
  // is "h2,http/1.1".
  message AutoHttpConfig {
    // HttpProtocolOptions are the options used when HTTP/1.1 is negotiated.
    Http1ProtocolOptions http_protocol_options = 1;

    // Http2ProtocolOptions are the options used when HTTP/2 is negotiated.
    Http2ProtocolOptions http2_protocol_options = 2;

    // Http3ProtocolOptions enables HTTP/3 among the candidates, it is never used when unset. The starling agent sets
    // no QUIC transport socket on the envoy cluster of a backend.
    Http3ProtocolOptions http3_protocol_options = 3;
  }

  // CommonHttpProtocolOptions apply to the connections to the backend, whatever their HTTP version.
  CommonHttpProtocolOptions common_http_protocol_options = 1;

  // UpstreamHttpProtocolOptions set SNI and certificate validation from the request for the connections to the
  // backend.
  UpstreamHttpProtocolOptions upstream_http_protocol_options = 2;

  // UpstreamProtocolOptions chooses how the protocol toward the backend is picked, one is required.
  oneof upstream_protocol_options {
    option (buf.validate.oneof).required = true;

    // ExplicitHttpConfig always uses the single protocol it sets.
    ExplicitHttpConfig explicit_http_config = 3;

    // UseDownstreamProtocolConfig uses the protocol of the client connection.
    UseDownstreamHttpConfig use_downstream_protocol_config = 4;

    // AutoConfig uses the protocol negotiated by ALPN with the backend.
    AutoHttpConfig auto_config = 5;
  }

}

// UpstreamHttpProtocolOptions sets the SNI and the certificate validation of the TLS connections to a backend from the
// request. They need TLS toward the backend (`enable_tls` of the backend).
message UpstreamHttpProtocolOptions {
  // AutoSni sets the SNI of each new connection to the backend from the host (`:authority`) header of the request, or
  // from the header named by `override_auto_sni_header`.
  bool auto_sni = 1;

  // AutoSanValidation checks that the certificate presented by the backend on each new connection matches the host
  // (`:authority`) header of the request, or the header named by `override_auto_sni_header`. It is meant to be used
  // with `auto_sni`.
  bool auto_san_validation = 2;

  // OverrideAutoSniHeader is the name of a request header used instead of the host header by `auto_sni` and
  // `auto_san_validation`. When the header is missing or empty, the host header is used. It has no effect when neither
  // of them is set.
  string override_auto_sni_header = 3
  [(buf.validate.field).string = {well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME max_len: 256}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// CommonHttpProtocolOptions are the HTTP options shared by every HTTP version. They apply to the connections to a
// backend in `HttpProtocolOptions`, and to the client connections in
// `flock.extensions.vs.starling_options.v1.HttpOptions`.
message CommonHttpProtocolOptions {

  // HeadersWithUnderscoresAction is the action taken on a client request with an underscore in a header name. No field
  // uses it yet. On http virtual servers the starling agent always rejects these requests (REJECT_REQUEST).
  enum HeadersWithUnderscoresAction {
    // ALLOW lets the request through with its headers.
    ALLOW = 0;

    // REJECT_REQUEST rejects the request, with a 400 status in HTTP/1 and a stream reset in HTTP/2. The envoy counter
    // "httpN.requests_rejected_with_underscores_in_headers" counts these requests.
    REJECT_REQUEST = 1;

    // DROP_HEADER drops the header before the filters of envoy see it. The envoy counter
    // "httpN.dropped_headers_with_underscores" counts the dropped headers.
    DROP_HEADER = 2;
  }

  // IdleTimeout closes a connection after this time without any active request. HTTP/2 PINGs don't keep the connection
  // alive. It is 1 hour when unset, and 0 disables it, which may leak connections whose TCP FIN was lost. An HTTP/2
  // client connection is drained before it is closed.
  google.protobuf.Duration idle_timeout = 1;

  // MaxConnectionDuration closes a connection this long after it was established. A connection without active stream
  // is closed at once, a client connection with active streams is drained first and closed at the end of the drain.
  // There is no maximum when unset.
  google.protobuf.Duration max_connection_duration = 3;

  // MaxHeadersCount is the maximum number of headers of a request, 100 when unset. A request with more headers is
  // answered 431 in HTTP/1 and its stream is reset in HTTP/2.
  google.protobuf.UInt32Value max_headers_count = 2 [(buf.validate.field).uint32 = {gte: 1}];

  // MaxStreamDuration resets a stream this long after it started, whatever the other timeouts. There is no maximum
  // when unset.
  google.protobuf.Duration max_stream_duration = 4;

  // MaxRequestsPerConnection is the maximum number of requests sent over one connection, no limit when unset. 1
  // disables keep alive. In HTTP/2 and HTTP/3 the limit is approximate because streams run concurrently.
  google.protobuf.UInt32Value max_requests_per_connection = 5;
}

// Http1ProtocolOptions are the options of HTTP/1 connections.
message Http1ProtocolOptions {
  // EnableTrailers proxies the HTTP/1 trailers, which are dropped otherwise. Envoy only sends trailers when it chunk
  // encodes the message, which happens when all of these hold:
  // - the request is HTTP/1.1
  // - the request is neither a HEAD request nor an HTTP upgrade
  // - the message is not the response to a HEAD request
  // - the message has no content-length header
  bool enable_trailers = 1;

  // SendFullyQualifiedUrl puts the scheme (inferred when missing) and the host (host or `:authority` header) before the
  // path in the request line sent to the backend. By default only the path is sent.
  bool send_fully_qualified_url = 2;
}

// KeepaliveSettings sends HTTP/2 PING frames to check that a connection is still alive.
message KeepaliveSettings {
  // Interval is the period of the PING frames, at least 1ms. No periodic PING is sent when unset.
  google.protobuf.Duration interval = 1 [(buf.validate.field).duration = {gte {nanos: 1000000}}];

  // Timeout is how long to wait for the answer to a PING before closing the connection, at least 1ms. Any frame
  // received on the connection extends the wait, so head-of-line blocking doesn't close a healthy connection.
  google.protobuf.Duration timeout = 2 [(buf.validate.field).duration = {
    gte {nanos: 1000000}
  }, (buf.validate.field).required = true];

  // ConnectionIdleInterval would send a PING before a new stream on a connection idle for this long. The starling
  // agent doesn't pass it to envoy, so it has no effect.
  google.protobuf.Duration connection_idle_interval = 4
  [(buf.validate.field).duration = {gte {nanos: 1000000}}];
}

// Http2ProtocolOptions are the options of HTTP/2 connections.
message Http2ProtocolOptions {
  // HpackTableSize is the maximum size in bytes of the HPACK dynamic table the encoder may use
  // (https://httpwg.org/specs/rfc7541.html#rfc.section.4.2), 4096 when unset. 0 disables header compression.
  google.protobuf.UInt32Value hpack_table_size = 1;

  // MaxConcurrentStreams is the maximum number of concurrent streams of one connection
  // (https://httpwg.org/specs/rfc7540.html#rfc.section.5.1.2), from 1 to 2147483647. When unset it is 1000000 for the
  // client connections of an http virtual server, and 2147483647 toward a backend.
  //
  // Toward a backend it also limits the streams envoy opens on one connection. Over the limit, envoy queues the
  // requests or opens more connections. Envoy lowers it on a connection when the backend announces a lower limit.
  google.protobuf.UInt32Value max_concurrent_streams = 2
  [(buf.validate.field).uint32 = {lte: 2147483647 gte: 1}];

  // InitialStreamWindowSize is the initial flow control window of a stream in bytes
  // (https://httpwg.org/specs/rfc7540.html#rfc.section.6.9.2), from 65535 to 2147483647. The starling agent uses 65536
  // when unset. It also bounds the bytes envoy buffers per stream in its HTTP/2 codec.
  google.protobuf.UInt32Value initial_stream_window_size = 3
  [(buf.validate.field).uint32 = {lte: 2147483647 gte: 65535}];

  // InitialConnectionWindowSize is the initial flow control window of a connection in bytes, from 65535 to 2147483647.
  // The starling agent uses 1048576 when unset.
  google.protobuf.UInt32Value initial_connection_window_size = 4
  [(buf.validate.field).uint32 = {lte: 2147483647 gte: 65535}];

  // AllowConnect allows proxying websockets and other upgrades over HTTP/2 CONNECT.
  bool allow_connect = 5;

  // MaxOutboundFrames is the maximum number of frames of any type waiting to be written to the socket, 10000 when
  // unset. Over it, envoy closes the connection as a flood and counts it in `http2.outbound_flood`.
  google.protobuf.UInt32Value max_outbound_frames = 6 [(buf.validate.field).uint32 = {gte: 1}];

  // MaxOutboundControlFrames is the maximum number of PING, SETTINGS and RST_STREAM frames waiting to be written to the
  // socket, 1000 when unset. Over it, envoy closes the connection as a flood and counts it in
  // `http2.outbound_control_flood`.
  google.protobuf.UInt32Value max_outbound_control_frames = 7 [(buf.validate.field).uint32 = {gte: 1}];

  // MaxConsecutiveInboundFramesWithEmptyPayload is the maximum number of consecutive HEADERS, CONTINUATION and DATA
  // frames received with an empty payload and no end of stream flag, 1 when unset. Over it, envoy closes the connection
  // as a flood and counts it in `http2.inbound_empty_frames_flood`. 0 closes the connection on the first such frame.
  google.protobuf.UInt32Value max_consecutive_inbound_frames_with_empty_payload = 8;

  // MaxInboundPriorityFramesPerStream limits the PRIORITY frames received, 100 when unset. Envoy closes the connection
  // as a flood, counted in `http2.inbound_priority_frames_flood`, when the PRIORITY frames received over its lifetime
  // exceed `max_inbound_priority_frames_per_stream * (1 + opened_streams)`. On a client connection `opened_streams`
  // grows when envoy receives the complete response headers from the backend. On a connection to a backend it grows
  // when envoy sends the HEADERS frame of a new stream.
  google.protobuf.UInt32Value max_inbound_priority_frames_per_stream = 9;

  // MaxInboundWindowUpdateFramesPerDataFrameSent limits the WINDOW_UPDATE frames received, 10 when unset. Envoy closes
  // the connection as a flood, counted in `http2.inbound_window_update_frames_flood`, when the WINDOW_UPDATE frames
  // received over its lifetime exceed
  // `5 + 2 * (opened_streams + max_inbound_window_update_frames_per_data_frame_sent * outbound_data_frames)`, with
  // `opened_streams` counted as for `max_inbound_priority_frames_per_stream`. 1 is enough for peers with basic flow
  // control, peers estimating the available bandwidth need at least 2.
  google.protobuf.UInt32Value max_inbound_window_update_frames_per_data_frame_sent = 10
  [(buf.validate.field).uint32 = {gte: 1}];

  // ConnectionKeepalive sends PING frames to check the connection, and closes it when the peer doesn't answer in time.
  KeepaliveSettings connection_keepalive = 11;
}



// QuicKeepAliveSettings sets the keep alive probes of a QUIC connection. Unlike HTTP/2 PINGs, a probe never times out
// waiting for its answer. A peer that doesn't answer ends with the idle timeout of the connection.
message QuicKeepAliveSettings {
  // MaxInterval is the longest interval between two probes (PING or PATH_RESPONSE), 0 or at least 1s. It should be
  // shorter than the idle timeout of the connection. A client connection starts probing at this interval when
  // `initial_interval` is unset or 0. 0 disables probing, and the QUICHE default interval is used when unset.
  google.protobuf.Duration max_interval = 1 [(buf.validate.field).duration = {
    lte {}
    gte {seconds: 1}
  }];

  // InitialInterval is the interval of the first probes, 0 or at least 1s. Each next probe waits exponentially longer,
  // up to `max_interval`. It should be shorter than the idle timeout of the connection and than `max_interval`. When
  // unset or 0, a server connection doesn't probe, and a client connection probes at `max_interval` (or the QUICHE
  // default) unless `max_interval` is 0.
  google.protobuf.Duration initial_interval = 2 [(buf.validate.field).duration = {
    lte {}
    gte {seconds: 1}
  }];
}

// QuicProtocolOptions are the QUIC options of HTTP/3 connections.
message QuicProtocolOptions {
  // MaxConcurrentStreams is the maximum number of streams the client can negotiate per connection, 100 when unset.
  google.protobuf.UInt32Value max_concurrent_streams = 1 [(buf.validate.field).uint32 = {gte: 1}];

  // InitialStreamWindowSize is the initial flow control receive window of a stream in bytes
  // (https://tools.ietf.org/html/draft-ietf-quic-transport-34#section-4.1), from 1 to 16777216, 65536 when unset. It
  // also bounds the bytes envoy buffers per stream in the QUIC stream buffers.
  google.protobuf.UInt32Value initial_stream_window_size = 2
  [(buf.validate.field).uint32 = {lte: 16777216 gte: 1}];

  // InitialConnectionWindowSize is the initial flow control receive window of a connection in bytes, from 1 to
  // 25165824, 65536 when unset.
  google.protobuf.UInt32Value initial_connection_window_size = 3
  [(buf.validate.field).uint32 = {lte: 25165824 gte: 1}];

  // NumTimeoutsToTriggerPortMigration is the number of QUIC path degrading timeouts (such as PTO) before a client
  // connection migrates to another port, from 0 to 5, 1 when unset. 0 disables the migration. It has no effect on
  // server connections.
  google.protobuf.UInt32Value num_timeouts_to_trigger_port_migration = 4
  [(buf.validate.field).uint32 = {lte: 5 gte: 0}];

  // ConnectionKeepalive probes the peer to get traffic back from it and push back the idle timeout of the connection.
  // When unset, a client connection sends a PING every 15s and a server connection doesn't probe.
  QuicKeepAliveSettings connection_keepalive = 5;
}

// Http3ProtocolOptions are the options of HTTP/3 connections.
message Http3ProtocolOptions {
  // QuicProtocolOptions are the QUIC options of the connection.
  QuicProtocolOptions quic_protocol_options = 1;

  // OverrideStreamErrorOnInvalidHttpMessage only terminates the offending stream on an invalid HEADERS frame when
  // true. When false or unset, the whole connection is terminated.
  google.protobuf.BoolValue override_stream_error_on_invalid_http_message = 2;

  // AllowExtendedConnect allows proxying websockets and other upgrades over HTTP/3 CONNECT, with the headers of the
  // HTTP/2 extended CONNECT (RFC 8441) and the settings proposed for HTTP/3
  // (https://datatracker.ietf.org/doc/draft-ietf-httpbis-h3-websockets/), which is not an RFC yet.
  bool allow_extended_connect = 5;
}
