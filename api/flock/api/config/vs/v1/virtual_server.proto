syntax = "proto3";

package flock.api.config.vs.v1;

import "buf/validate/validate.proto";
import "flock/api/config/core/v1/tls.proto";
import "flock/api/config/limit/v1/limit.proto";
import "flock/api/config/route/v1/external_auth.proto";
import "flock/api/config/route/v1/virtual_host.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/api/config/vs/v1;vs";

// VirtualServer is a port with a route configuration. It serves traffic on every VIP that lists it in
// virtual_servers_uuid.
message VirtualServer {
  // Identifier of the VirtualServer, set by the controller on creation.
  string UUID = 1;
  // Name of the VirtualServer
  string name = 2 [(buf.validate.field).string = {min_len: 1}];
  // Port the VirtualServer listens on, on each of its VIPs.
  uint32 port = 3 [(buf.validate.field).uint32 = {gt: 0, lte: 65535}];
  // Kind of Route configuration of the VirtualServer. The controller refuses a backend or certificate UUID that
  // doesn't exist.
  oneof route_config {
    option (buf.validate.oneof).required = true;
    // TCP Route configuration
    TcpRouteConfig tcp_route_config = 4;
    // UDP Route configuration
    UdpRouteConfig udp_route_config = 5;
    // HTTP Route configuration
    HttpRoutesConfig http_routes_config = 6;
    // TLS over TCP Route configuration
    TlsTcpRoutesConfig tls_tcp_routes_config = 7;
  }
  // Set to true to log tcp syn packets and udp packets (for udp virtual server)
  // This log will give source ip, source port, destination ip, destination port and the protocol used.
  // It is off by default because it can produce a lot of logs.
  // On udp, each packet produces a log line, which can be a lot of logs and can have a performance impact.
  // On a port shared by several virtual servers of a VIP, enabling it on one of them logs the whole port.
  // It only works on agent implementations that support it.
  bool enable_l3_log = 8;

  // Limits on the connections of the VirtualServer, applied on each VIP. An agent may apply only the first limit of
  // each kind. On a wildcard VIP (ip 0.0.0.0 or ::), the starling agent applies each limit on every address of the
  // machine the VIP stands for, so each address gets its own limit.
  repeated limit.v1.Config limit_config = 10 [(buf.validate.field).repeated.max_items = 16];

  // Free key/value pairs attached to the VirtualServer. The controller indexes them, so list filters with is_metadata
  // can match them.
  // A value `secret://<secret uuid>/<key>` points at a value of a Secret instead of holding it, see
  // flock.api.config.secret.v1.Secret.
  map<string, string> metadata = 9;
}

// TcpRouteConfig describe the route configuration for a TCP VirtualServer
message TcpRouteConfig {
  // UUID of the Backend to route the traffic to
  string backend_uuid = 1 [(buf.validate.field).string = {min_len: 1}];
  // Extension point for custom options dedicated to a load balancer implementation.
  // valid extensions are:
  // - flock.extensions.vs.starling_options.v1.TcpUdpOptions
  // - flock.extensions.vs.f5_options.v1.VirtualServerOptions
  google.protobuf.Any typed_options = 2;
  // Read a proxy protocol header (v1 or v2) sent by the client before anything else:
  // the client address it holds becomes the client address of the connection.
  // Connections without the header are refused.
  bool accept_proxy_protocol = 3;
}

// UdpRouteConfig describe the route configuration for a UDP VirtualServer
message UdpRouteConfig {
  // UUID of the Backend to route the traffic to
  string backend_uuid = 1 [(buf.validate.field).string = {min_len: 1}];
  // Extension point for custom options dedicated to a load balancer implementation.
  // valid extensions are:
  // - flock.extensions.vs.starling_options.v1.TcpUdpOptions
  // - flock.extensions.vs.f5_options.v1.VirtualServerOptions
  google.protobuf.Any typed_options = 2;
}

// TlsTcpRoutesConfig describe multiple routes configuration for TLS over TCP VirtualServer
message TlsTcpRoutesConfig {
  // Routes of the VirtualServer, chosen by the SNI of each connection, so several certificates or server names can
  // go to different backends.
  repeated TlsTcpRouteConfig routes = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
  // Extension point for custom options dedicated to a load balancer implementation.
  // valid extensions are:
  // - flock.extensions.vs.starling_options.v1.TlsTcpOptions
  // - flock.extensions.vs.f5_options.v1.VirtualServerOptions
  google.protobuf.Any typed_options = 2;
  // Read a proxy protocol header (v1 or v2) sent by the client before anything else:
  // the client address it holds becomes the client address of the connection.
  // Connections without the header are refused.
  bool accept_proxy_protocol = 3;
}

// TlsTcpRouteConfig describe the route configuration for a TLS over TCP VirtualServer
message TlsTcpRouteConfig {
  // UUID of the Backend to route the traffic to
  string backend_uuid = 1 [(buf.validate.field).string = {min_len: 1}];
  // How the TLS connection is handled: terminated by the load balancer or passed through to the backend
  oneof mode {
    option (buf.validate.oneof).required = true;
    // TLS is terminated by the load balancer with the given certificates,
    // the decrypted traffic is sent to the backend.
    // if tls.server_names is set, this route only gets the connections with one of those SNI
    flock.api.config.core.v1.TLS tls = 2;
    // TLS is not terminated: the connection is routed on its SNI and sent encrypted to the backend,
    // the backends keep their own certificates
    TlsPassthrough passthrough = 3;
  }
  // Extension point for custom options dedicated to a load balancer implementation.
  // valid extensions are:
  // - flock.extensions.vs.starling_options.v1.TlsTcpOptions
  google.protobuf.Any typed_options = 4;
}

// TlsPassthrough describe a TLS route sending the connections encrypted to its backend
message TlsPassthrough {
  // SNI of the connections this route gets, matched as tls.server_names (wildcards like *.example.com allowed).
  // If empty, the route gets the connections no other route of the virtual server matches,
  // connections without TLS included.
  repeated string server_names = 1 [(buf.validate.field).repeated.max_items = 100, (buf.validate.field).repeated.items.string.max_len = 253];
}

// HttpRoutesConfig describe multiple routes configuration for a HTTP VirtualServer
message HttpRoutesConfig {
  // Virtual hosts of the VirtualServer, chosen by the host header of each request, so several domains can go to
  // different backends. A domain can be in one virtual host only.
  repeated flock.api.config.route.v1.VirtualHost virtual_hosts = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  // Extension point for custom options dedicated to a load balancer implementation.
  // valid extensions are:
  // - flock.extensions.vs.starling_options.v1.HttpOptions
  // - flock.extensions.vs.f5_options.v1.VirtualServerOptions
  google.protobuf.Any typed_options = 2;
  // Read a proxy protocol header (v1 or v2) sent by the client before anything else:
  // the client address it holds becomes the client address of the connection.
  // Connections without the header are refused.
  bool accept_proxy_protocol = 3;
  // External auth policies of the virtual server, which virtual hosts and routes pick by name. The controller refuses
  // a policy name defined twice, and a virtual host or route naming a policy not defined here.
  repeated flock.api.config.route.v1.ExternalAuth external_auths = 4 [
    (buf.validate.field).repeated.max_items = 16,
    (buf.validate.field).cel = {
      id: "unique_names"
      message: "names must be unique"
      expression: "this.map(p, p.name).unique()"
    }
  ];
}
