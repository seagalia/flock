syntax = "proto3";

package flock.api.config.secret.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/api/config/secret/v1;secret";

// Secret holds sensitive values (tokens, passwords, keys) that the metadata of other resources points at with a
// `secret://<secret uuid>/<key>` value instead of carrying them. The controller stores it encrypted and never sends
// its values back in read and list answers, only RevealSecret and the agents that need it get them.
message Secret {
  // UUID is the unique identifier of the secret, set by the controller on creation.
  string UUID = 1;
  // Name is the name of the secret.
  string name = 2 [(buf.validate.field).string = {min_len: 1}];
  // Data is the content of the secret, one value per key. Read and list answers keep the keys and leave the values
  // empty. On update a key sent with an empty value keeps its stored value, and a key left out is removed.
  map<string, string> data = 3 [(buf.validate.field).map = {
    min_pairs: 1,
    max_pairs: 64,
    keys: {string: {pattern: "^[A-Za-z0-9._-]{1,128}$"}},
    values: {string: {max_len: 65536}}
  }];
  // Free key/value pairs attached to the secret, never sensitive. The controller indexes them, so list filters with
  // is_metadata can match them. They cannot point at a secret.
  map<string, string> metadata = 4;
}
