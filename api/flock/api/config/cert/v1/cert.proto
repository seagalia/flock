syntax = "proto3";

package flock.api.config.cert.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/api/config/cert/v1;cert";

// Certificate is a certificate and its private key, used by virtual servers to terminate TLS. Virtual servers refer
// to it by UUID in the certificates_uuid of their TLS options.
message Certificate {
  // UUID is the unique identifier of the certificate, set by the controller on creation.
  string UUID = 1;
  // Name is the name of the certificate.
  string name = 2 [(buf.validate.field).string = {min_len: 1}];
  // CertChain is the PEM certificate chain served to the clients. The controller checks it forms a valid pair with
  // private_key. An agent ignores a certificate missing either of them.
  string cert_chain = 3;
  // PrivateKey is the PEM private key of cert_chain. Read and list answers of the controller leave it empty.
  string private_key = 4;
  // CA is a PEM certificate authority stored with the certificate. The controller checks it is PEM.
  string ca = 5;
  // DomainNames is the list of domain names the certificate covers, exact (www.example.com) or one label wildcards
  // (*.example.com). The controller doesn't check them against cert_chain, so keep them in sync with the
  // certificate.
  repeated string domain_names = 6 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.max_len = 253
  ];
  // Free key/value pairs attached to the certificate. The controller indexes them, so list filters with is_metadata
  // can match them. A value `secret://<secret uuid>/<key>` points at a value of a Secret instead of holding it, see
  // flock.api.config.secret.v1.Secret.
  map<string, string> metadata = 7;
}
