// copy from envoy type
syntax = "proto3";

package flock.type.v1;

option go_package = "github.com/seagalia/flock/sdk/flock/type/v1;flocktype";

// [#protodoc-title: HTTP]

// CodecClientType is the HTTP version a client uses.
enum CodecClientType {
  // HTTP/1.1.
  HTTP1 = 0;

  // HTTP/2. An agent may fall back to HTTP/1.1 when HTTP/2 can't be negotiated, for example without TLS.
  HTTP2 = 1;

  // HTTP/3 over QUIC.
  HTTP3 = 2;
}
