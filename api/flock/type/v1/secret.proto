syntax = "proto3";

package flock.type.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/seagalia/flock/sdk/flock/type/v1;flocktype";

// SecretKeyRef points at the value stored under `key` in the secret `secret_uuid`, so the resource holding it never
// shows the value. The agents of the resource receive the secret and use its value. In a manifest of the cli,
// `secret_uuid` also takes `name:<secret name>`, which the cli turns into the uuid before sending.
message SecretKeyRef {
  // UUID of the secret.
  string secret_uuid = 1 [(buf.validate.field).string = {min_len: 1}];
  // Key of the value in the data of the secret.
  string key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
}
