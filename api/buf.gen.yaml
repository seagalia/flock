version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../sdk
    opt:
      - module=github.com/seagalia/flock/sdk
  - remote: buf.build/connectrpc/go:v2.0.1
    out: ../sdk
    opt:
      - module=github.com/seagalia/flock/sdk
    exclude_types:
      - starling_waf.**
  # typescript messages and service descriptors of the webui, called with connect-web
  - remote: buf.build/bufbuild/es:v2.16.0
    out: ../webui/src/gen
    include_imports: true
    opt:
      - target=ts
    exclude_types:
      - starling_waf.**
  - remote: buf.build/grpc/go:v1.6.2
    out: ../sdk
    opt:
      - module=github.com/seagalia/flock/sdk
    types:
      - starling_waf.**