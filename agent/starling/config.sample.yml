log:
  level: debug
  in_json: false
controller:
  addr: 127.0.0.1:8443
  server_name: flock_controller_server
  instance_uuid: 1
envoy:
  exec:
    log_level: info
tls:
  cert_file: ./cert.crt
  key_file: ./key.key
  ca_file: ./ca.crt
advertisement:
  bgp:
    # local asn to use
    local_asn: 65000
    # (optional) router id to use
    # if nil it will be the higest ip of interfaces set as source in peers
    router_id: ~
    # peers to connect to
    peers:
      # peer name
      - name: my-peer
        # AS number to expect from the remote end of the session.
        peer_asn: 65001
        # (optional) Source interface to use when establishing the session.
        # Default to default interface if src_addr is not set
        # Cannot be set in same time as src_addr
        src_interface: eth0
        # (optional) Source address to use when establishing the session.
        # Cannot be set in same time as src_interface
        src_addr: ~
        # (optional) AS number to use for the local end of the session.
        # Default to local_asn
        my_asn: ~
        # (optional) Port to dial when establishing the session.
        # Default to 179
        port: 179
        # (optional) Time interval in seconds that a BGP session will be
        #	considered active in the absence of keepalive or other
        #	messages from the peer.  The hold-time is typically
        #	set to 3x the keepalive_time.
        # Default to 90s
        hold_time: 90s
        # (optional) Time interval in seconds between transmission of keepalive
        # messages to the neighbor.  Typically set to 1/3 the
        # hold-time.
        # Default to 30s
        keepalive_interval: 30s
        # (optional) Time interval in seconds between attempts to establish a
        # session with the peer.
        # Default to 120s
        connect_retry: 120s
        # (optional) Authentication password for routers enforcing TCP MD5 authenticated sessions
        password: ~
        # (optional) ebgp peer is multi-hops away.
        ebgp_multi_hop: false
        # (Optional) name of the vrf to establish the session from
        vrf: ~
        # (Optional) BFD with the peer, detects a down peer faster than the hold time
        # bfd:
        #   enabled: true
        #   desired_minimum_tx_interval: 300ms
        #   required_minimum_receive: 300ms
        #   detection_multiplier: 3
    # (Optional) list of advertissement specification
    advertisements:
      # (Optional) BGP LOCAL_PREF attribute which is used by BGP best path algorithm,
      # Path with higher localpref is preferred over one with lower localpref.
      - local_pref: 0
        # (Optional) BGP communities to be associated with the announcement. Each item can be a
        # community of the form 1234:1234 or the name of an alias defined in the Community CRD.
        communities: [ "3356:70" ]
        # (Optional) list of Cidr to advertise via this advertisement, selected by name.
        # this will apply local_pref and communities to all cidrs selected
        # if empty, all cidrs will be advertised with those attributes
        cidrs: [ "10.0.0.0/8" ]
  # can be a list of interfaces to advertise
  interfaces: ~
